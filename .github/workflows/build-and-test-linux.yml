name: Build and Test

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore CL.Crossplatform.sln

      - name: Build
        run: dotnet build CL.Crossplatform.sln -c Release --no-restore

      - name: Test
        run: dotnet test CL.Crossplatform.sln -c Release --no-build --verbosity normal

      - name: Publish Linux x64
        run: dotnet publish CL.Avalonia/CL.Avalonia.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -o ./publish/linux-x64

      - name: Make launcher executable
        run: chmod +x ./publish/linux-x64/CL.Avalonia

      - name: Create tar.gz archive
        run: |
          mkdir -p ./staging/CLegendaryLauncher-linux-x64
          cp -r ./publish/linux-x64/. ./staging/CLegendaryLauncher-linux-x64/
          chmod +x ./staging/CLegendaryLauncher-linux-x64/CL.Avalonia
          tar -czf ./CLegendaryLauncher-linux-x64.tar.gz \
              --owner=0 --group=0 --numeric-owner \
              -C ./staging CLegendaryLauncher-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLegendaryLauncher-linux-x64
          path: ./CLegendaryLauncher-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30
