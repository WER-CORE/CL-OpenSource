name: macOS Interactive Debug (GUI Desktop + VNC + SSH)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'Пароль для захисту VNC (ваш секретний пароль для входу)'
        required: true
        default: 'CL2026Secure!'
        type: string
      os_runner:
        description: 'Версія macOS'
        required: true
        default: 'macos-latest'
        type: choice
        options:
          - 'macos-latest' # Apple Silicon M1 (macOS 14 Sonoma)
          - 'macos-15'     # Apple Silicon (macOS 15 Sequoia)
          - 'macos-14'     # Apple Silicon M1 (macOS 14 Sonoma)
          - 'macos-13'     # Intel x86_64 (macOS 13 Ventura)
      build_launcher:
        description: 'Автоматично зібрати CL.Avalonia перед стартом'
        required: false
        type: boolean
        default: true
      setup_java:
        description: 'Встановити Java 21 для Minecraft'
        required: false
        type: boolean
        default: true
      ngrok_token:
        description: 'Ngrok Auth Token (необов’язково, для прямого VNC без SSH)'
        required: false
        default: ''
        type: string

jobs:
  macos-gui-session:
    name: Interactive macOS Desktop
    runs-on: ${{ github.event.inputs.os_runner || 'macos-latest' }}
    timeout-minutes: 360 # До 6 годин сесії

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Java (Temurin 21)
        if: ${{ github.event.inputs.setup_java == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build CL.Avalonia
        if: ${{ github.event.inputs.build_launcher == 'true' }}
        run: |
          dotnet build CL.Avalonia/CL.Avalonia.csproj -c Release
          chmod +x CL.Avalonia/bin/Release/net10.0/CL.Avalonia || true
          echo "Збірка CL.Avalonia успішно завершена!"

      - name: Configure Secure macOS VNC (Screen Sharing)
        env:
          VNC_PASSWORD: ${{ github.event.inputs.vnc_password }}
        run: |
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          # 1. Записуємо зашифрований VNC пароль у налаштування macOS
          echo "$VNC_PASSWORD" | perl -we '
            @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA";
            $_ = <>; chomp; s/^(.{8}).*/$1/;
            @p = unpack "C*", $_;
            foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }
            print "\n"
          ' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt

          # 2. Надаємо повні права для всіх користувачів та вмикаємо VNC legacy з паролем
          sudo $KICKSTART -configure -allowAccessFor -allUsers -privs -all
          sudo $KICKSTART -configure -clientopts -setvnclegacy -vnclegacy yes
          sudo $KICKSTART -configure -clientopts -setvncpw -vncpw "$VNC_PASSWORD" || true

          # 3. Активуємо та перезапускаємо службу екрана
          sudo $KICKSTART -activate
          sudo $KICKSTART -restart -agent -console

          echo "✅ macOS Screen Sharing (VNC на порту 5900) успішно активовано та запаролено!"

      - name: Setup noVNC and Remote Access Tunnels
        run: |
          # 1. Встановлюємо залежності
          brew install tmate cloudflare/cloudflare/cloudflared || true
          pip3 install --break-system-packages websockify || true
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc || true

          # 2. Запускаємо веб-сервер noVNC на порту 6080
          nohup python3 -m websockify --web /tmp/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          sleep 2
          echo "✅ noVNC Web Server запущено на порту 6080!"

          # 3. Запускаємо прямий Cloudflare HTTPS веб-тунель для браузера (безкоштовно, без реєстрації)
          nohup cloudflared tunnel --url http://127.0.0.1:6080 > /tmp/cloudflared.log 2>&1 &
          sleep 6
          CF_URL=$(grep -o 'https://[-a-zA-Z0-9@:%._\+~#=]\+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)

          # 4. Запускаємо tmate сесію для SSH
          tmate -S /tmp/tmate.sock new-session -d
          tmate -S /tmp/tmate.sock wait tmate-ready
          TMATE_SSH=$(tmate -S /tmp/tmate.sock display -p '#{tmate_ssh}')
          TMATE_WEB=$(tmate -S /tmp/tmate.sock display -p '#{tmate_web}')

          echo "================================================================================"
          echo "🎉 СЕСІЮ РОБОЧОГО СТОЛУ MACOS УСПІШНО ЗАПУЩЕНО!"
          echo "================================================================================"
          if [ -n "$CF_URL" ]; then
            echo ""
            echo "🌐 ВАРІАНТ 1: ПРЯМИЙ ВХІД З БРАУЗЕРА (БЕЗ SSH ТА ВСТАНОВЛЕННЯ ПРОГРАМ):"
            echo "👉 ПЕРЕЙДІТЬ ЗА ПОСИЛАННЯМ: $CF_URL/vnc.html"
            echo "   (Введіть свій VNC пароль, і Mac відкриється просто у вкладці браузера!)"
            echo ""
          fi
          echo "💻 ВАРІАНТ 2: ЧЕРЕЗ SSH-ТУНЕЛЬ НА ВАШОМУ КОМП'ЮТЕРІ (noVNC):"
          echo "   У терміналі Windows (PowerShell) виконайте:"
          echo "   ssh -L 6080:127.0.0.1:6080 $TMATE_SSH"
          echo "   Після цього відкрийте у браузері: http://localhost:6080/vnc.html"
          echo ""
          echo "🖥️ ВАРІАНТ 3: ЧЕРЕЗ VNC VIEWER (TigerVNC / RealVNC):"
          echo "   ssh -L 5900:127.0.0.1:5900 $TMATE_SSH"
          echo "   Підключіться до 127.0.0.1:5900 та введіть свій пароль."
          echo ""
          echo "⌨️  ВАРІАНТ 4: ВЕБ-ТЕРМІНАЛ MACOS:"
          echo "   👉 $TMATE_WEB"
          echo ""
          echo "🚀 Шлях до скомпільованого CL.Avalonia:"
          echo "   $PWD/CL.Avalonia/bin/Release/net10.0/CL.Avalonia"
          echo "================================================================================"

          # Записуємо посилання у Summary воркфлоу на GitHub
          echo "### 🖥️ Підключення до macOS Desktop" >> $GITHUB_STEP_SUMMARY
          if [ -n "$CF_URL" ]; then
            echo "- 🌐 **[Прямий вхід через браузер (noVNC)]($CF_URL/vnc.html)** (пароль той, що ввели при запуску)" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- 💻 **SSH Команда:** \`$TMATE_SSH\`" >> $GITHUB_STEP_SUMMARY
          echo "- ⌨️ **[Веб-термінал]($TMATE_WEB)**" >> $GITHUB_STEP_SUMMARY

          # Утримуємо сесію живою
          while [ -S /tmp/tmate.sock ]; do
            sleep 10
          done
