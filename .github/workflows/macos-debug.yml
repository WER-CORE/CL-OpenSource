name: macOS Interactive Debug (GUI Desktop + VNC + SSH)

on:
  workflow_dispatch:
    inputs:
      vnc_password:
        description: 'Пароль для захисту VNC (ваш секретний пароль для входу)'
        required: true
        default: 'CL2026Secure!'
        type: string
      os_runner:
        description: 'Версія macOS'
        required: true
        default: 'macos-latest'
        type: choice
        options:
          - 'macos-latest' # Apple Silicon M1 (macOS 14 Sonoma)
          - 'macos-15'     # Apple Silicon (macOS 15 Sequoia)
          - 'macos-14'     # Apple Silicon M1 (macOS 14 Sonoma)
          - 'macos-13'     # Intel x86_64 (macOS 13 Ventura)
      build_launcher:
        description: 'Автоматично зібрати CL.Avalonia перед стартом'
        required: false
        type: boolean
        default: true
      setup_java:
        description: 'Встановити Java 21 для Minecraft'
        required: false
        type: boolean
        default: true
      ngrok_token:
        description: 'Ngrok Auth Token (необов’язково, для прямого VNC без SSH)'
        required: false
        default: ''
        type: string

jobs:
  macos-gui-session:
    name: Interactive macOS Desktop
    runs-on: ${{ github.event.inputs.os_runner || 'macos-latest' }}
    timeout-minutes: 360 # До 6 годин сесії

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Setup Java (Temurin 21)
        if: ${{ github.event.inputs.setup_java == 'true' }}
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build CL.Avalonia
        if: ${{ github.event.inputs.build_launcher == 'true' }}
        run: |
          dotnet build CL.Avalonia/CL.Avalonia.csproj -c Release
          chmod +x CL.Avalonia/bin/Release/net10.0/CL.Avalonia || true
          echo "Збірка CL.Avalonia успішно завершена!"

      - name: Configure Secure macOS VNC (Screen Sharing)
        env:
          VNC_PASSWORD: ${{ github.event.inputs.vnc_password }}
        run: |
          KICKSTART="/System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart"

          # 1. Записуємо зашифрований VNC пароль у налаштування macOS
          echo "$VNC_PASSWORD" | perl -we '
            @k = unpack "C*", pack "H*", "1734516E8BA8C5E2FF1C39567390ADCA";
            $_ = <>; chomp; s/^(.{8}).*/$1/;
            @p = unpack "C*", $_;
            foreach (@k) { printf "%02X", $_ ^ (shift @p || 0) }
            print "\n"
          ' | sudo tee /Library/Preferences/com.apple.VNCSettings.txt

          # 2. Надаємо повні права для всіх користувачів та вмикаємо VNC legacy з паролем
          sudo $KICKSTART -configure -allowAccessFor -allUsers -privs -all
          sudo $KICKSTART -configure -clientopts -setvnclegacy -vnclegacy yes
          sudo $KICKSTART -configure -clientopts -setvncpw -vncpw "$VNC_PASSWORD" || true

          # 3. Активуємо та перезапускаємо службу екрана
          sudo $KICKSTART -activate
          sudo $KICKSTART -restart -agent -console

          echo "✅ macOS Screen Sharing (VNC на порту 5900) успішно активовано та запаролено!"

      - name: Setup noVNC (Web Browser Access)
        run: |
          pip3 install websockify || true
          git clone --depth 1 https://github.com/novnc/noVNC.git /tmp/novnc || true
          # Запускаємо веб-сервер noVNC на порту 6080 у фоновому режимі
          nohup python3 -m websockify --web /tmp/novnc 6080 localhost:5900 > /tmp/novnc.log 2>&1 &
          sleep 2
          echo "✅ noVNC Web Server запущено на порту 6080!"

      - name: Setup Ngrok Tunnel (Optional)
        if: ${{ github.event.inputs.ngrok_token != '' }}
        env:
          NGROK_TOKEN: ${{ github.event.inputs.ngrok_token }}
        run: |
          brew install ngrok/ngrok/ngrok || true
          ngrok config add-authtoken "$NGROK_TOKEN"
          ngrok tcp 5900 --log=stdout > ngrok.log 2>&1 &
          sleep 3
          NGROK_URL=$(curl -s http://127.0.0.1:4040/api/tunnels | grep -o 'tcp://[^"]*' || true)
          echo "================================================================"
          echo "🌐 ПРЯМА АДРЕСА VNC ЧЕРЕЗ NGROK: $NGROK_URL"
          echo "Введіть цю адресу у VNC Viewer та введіть свій пароль."
          echo "================================================================"

      - name: Print Connection Instructions
        run: |
          echo "================================================================================"
          echo "🖥️  ІНСТРУКЦІЯ ПІДКЛЮЧЕННЯ ДО РОБОЧОГО СТОЛУ MACOS:"
          echo "--------------------------------------------------------------------------------"
          echo "1. Нижче в кроці 'Start Tmate Session' скопіюйте SSH рядок підключення."
          echo "   Наприклад: ssh -X abc123def@nyc1.tmate.io"
          echo ""
          echo "🌐 ВАРІАНТ А (ЧЕРЕЗ БРАУЗЕР - noVNC, без встановлення жодних програм!):"
          echo "   У терміналі Windows запустіть тунель для веб-порту 6080:"
          echo "   ssh -L 6080:127.0.0.1:6080 <ваша_команда_з_tmate>"
          echo "   Після цього відкрийте у браузері Chrome/Edge/Firefox:"
          echo "   👉 http://localhost:6080/vnc.html"
          echo "   Введіть пароль VNC — і робочий стіл Mac відкриється прямо у вкладці браузера!"
          echo ""
          echo "💻 ВАРІАНТ Б (ЧЕРЕЗ VNC VIEWER):"
          echo "   ssh -L 5900:127.0.0.1:5900 <ваша_команда_з_tmate>"
          echo "   Відкрийте VNC Viewer, адреса 127.0.0.1:5900 та введіть свій пароль."
          echo ""
          echo "🚀 Шлях до готового лаунчера на Mac:"
          echo "   $PWD/CL.Avalonia/bin/Release/net10.0/CL.Avalonia"
          echo "================================================================================"

      - name: Start Tmate Session (SSH Tunnel & Console)
        uses: mxschmitt/action-tmate@v3
        with:
          detached: false
