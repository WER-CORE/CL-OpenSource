name: Build & Test & Artifact

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore CL.Crossplatform.sln

      - name: Build
        run: dotnet build CL.Crossplatform.sln -c Release --no-restore

      - name: Test
        run: dotnet test CL.Crossplatform.sln -c Release --no-build --verbosity normal

      - name: Publish Linux x64
        run: dotnet publish CL.Avalonia/CL.Avalonia.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -o ./publish/linux-x64

      - name: Make launcher executable
        run: chmod +x ./publish/linux-x64/CL.Avalonia

      - name: Create tar.gz archive
        run: |
          mkdir -p ./staging/CLegendaryLauncher-linux-x64
          cp -r ./publish/linux-x64/. ./staging/CLegendaryLauncher-linux-x64/
          chmod +x ./staging/CLegendaryLauncher-linux-x64/CL.Avalonia
          tar -czf ./CLegendaryLauncher-linux-x64.tar.gz \
              --owner=0 --group=0 --numeric-owner \
              -C ./staging CLegendaryLauncher-linux-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLegendaryLauncher-linux-x64
          path: ./CLegendaryLauncher-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore CL.Crossplatform.sln

      - name: Build
        run: dotnet build CL.Crossplatform.sln -c Release --no-restore

      - name: Test
        run: dotnet test CL.Crossplatform.sln -c Release --no-build --verbosity normal

      - name: Publish macOS arm64 (Apple Silicon)
        run: dotnet publish CL.Avalonia/CL.Avalonia.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=false -o ./publish/osx-arm64

      - name: Create ZIP archive
        run: |
          ditto -c -k --sequesterRsrc ./publish/osx-arm64 ./CLegendaryLauncher-osx-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLegendaryLauncher-osx-arm64
          path: ./CLegendaryLauncher-osx-arm64.zip
          if-no-files-found: error
          retention-days: 30

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore CL.Crossplatform.sln

      - name: Build
        run: dotnet build CL.Crossplatform.sln -c Release --no-restore

      - name: Test
        run: dotnet test CL.Crossplatform.sln -c Release --no-build --verbosity normal

      - name: Publish Windows x64
        run: dotnet publish CL.Avalonia/CL.Avalonia.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o ./publish/win-x64

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path ./publish/win-x64/* -DestinationPath ./CLegendaryLauncher-win-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLegendaryLauncher-win-x64
          path: ./CLegendaryLauncher-win-x64.zip
          if-no-files-found: error
          retention-days: 30
