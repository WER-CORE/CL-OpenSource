name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.1.0)'
        required: true
        default: '1.1.0'
      is_prerelease:
        description: 'Mark as pre-release for preview testing'
        type: boolean
        required: true
        default: true
      target_repo:
        description: 'Target repository for release'
        required: true
        default: 'WER-CORE/CL-Win-Edition--Update'
      changelog:
        description: 'Release changelog / description (Markdown and images supported)'
        type: string
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.calc.outputs.version }}
      numeric_version: ${{ steps.calc.outputs.numeric_version }}
      is_prerelease: ${{ steps.calc.outputs.is_prerelease }}
      target_repo: ${{ steps.calc.outputs.target_repo }}
      changelog: ${{ steps.calc.outputs.changelog }}
    steps:
      - id: calc
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ inputs.version }}"
            IS_PRE="${{ inputs.is_prerelease }}"
            TARGET="${{ inputs.target_repo }}"
          else
            REF="${{ github.ref_name }}"
            VER="${REF#v}"
            IS_PRE="false"
            TARGET="WER-CORE/CL-Win-Edition--Update"
          fi
          NUM_VER=$(echo "$VER" | cut -d'-' -f1)
          echo "version=$VER" >> $GITHUB_OUTPUT
          echo "numeric_version=$NUM_VER" >> $GITHUB_OUTPUT
          echo "is_prerelease=$IS_PRE" >> $GITHUB_OUTPUT
          echo "target_repo=$TARGET" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "${{ inputs.changelog }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build-windows:
    needs: prepare
    runs-on: windows-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      NUMERIC_VERSION: ${{ needs.prepare.outputs.numeric_version }}
      IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID || secrets.SIGNPATH_ORGANIZATION_ID || 'ee9101d1-c7a5-4c9b-8415-756078e535be' }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || secrets.SIGNPATH_PROJECT_SLUG || 'CL-Launcher' }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || secrets.SIGNPATH_SIGNING_POLICY_SLUG || 'test-signing' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          dotnet-quality: 'preview'

      - name: Generate compiled secrets
        if: env.APP_SECRETS_JSON != ''
        shell: pwsh
        env:
          APP_SECRETS_JSON: ${{ secrets.APP_SECRETS_JSON }}
        run: |
          $json = $env:APP_SECRETS_JSON | ConvertFrom-Json
          $secrets = $json.Secrets
          if (-not $secrets) { $secrets = $json }
          $code = @"
          namespace CL.Core.Services;

          public static partial class SecretsProvider
          {
              static partial void ApplyCompiledDefaults(SecretConfiguration config)
              {
                  config.LauncherSecret = "$($secrets.LauncherSecret)";
                  config.CurseForgeKeyUrl = "$($secrets.CurseForgeKeyUrl)";
                  config.CurseForgeDirectApiKey = "$($secrets.CurseForgeDirectApiKey)";
                  config.GeminiApiUrl = "$($secrets.GeminiApiUrl)";
                  config.GeminiModelUrl = "$($secrets.GeminiModelUrl)";
                  config.GeminiDirectApiKey = "$($secrets.GeminiDirectApiKey)";
                  config.SentryDsn = "$($secrets.SentryDsn)";
                  config.AzureClientId = "$($secrets.AzureClientId)";
                  config.DiscordClientId = "$($secrets.DiscordClientId)";
              }
          }
          "@
          $code | Out-File -FilePath "CL.Core/Services/SecretsProvider.Compiled.cs" -Encoding utf8

      - name: Restore dependencies
        run: dotnet restore CL.Crossplatform.sln

      - name: Run unit tests
        run: dotnet test CL.Crossplatform.sln -c Release --no-restore --verbosity normal

      - name: Publish Windows x64
        run: dotnet publish CL.Avalonia/CL.Avalonia.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:IsPreviewBuild=${{ env.IS_PRERELEASE }} -p:Version=${{ env.RELEASE_VERSION }} -p:AssemblyVersion=${{ env.NUMERIC_VERSION }}.0 -p:FileVersion=${{ env.NUMERIC_VERSION }}.0 -p:InformationalVersion=${{ env.RELEASE_VERSION }} -o ./publish/win-x64

      - name: Sign launcher via SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        continue-on-error: true
        shell: pwsh
        run: |
          Install-Module -Name SignPath -Force -Scope CurrentUser
          New-Item -ItemType Directory -Path "./signed-launcher" -Force | Out-Null
          Submit-SigningRequest `
            -InputArtifactPath "./publish/win-x64/CL(CLegendary Launcher).exe" `
            -OutputArtifactPath "./signed-launcher/CL(CLegendary Launcher).exe" `
            -ApiToken "${{ env.SIGNPATH_API_TOKEN }}" `
            -OrganizationId "${{ env.SIGNPATH_ORGANIZATION_ID }}" `
            -ProjectSlug "${{ env.SIGNPATH_PROJECT_SLUG }}" `
            -SigningPolicySlug "${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}" `
            -WaitForCompletion

      - name: Replace launcher with signed binary
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          if (Test-Path "./signed-launcher/CL(CLegendary Launcher).exe") {
            Copy-Item -Path "./signed-launcher/CL(CLegendary Launcher).exe" -Destination "./publish/win-x64/CL(CLegendary Launcher).exe" -Force
            Copy-Item -Path "./signed-launcher/CL(CLegendary Launcher).exe" -Destination "./publish/win-x64/CL.Avalonia.exe" -Force
          }

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Package with Velopack
        shell: pwsh
        run: |
          vpk pack --packId "CLegendaryLauncher" `
                   --packVersion "${{ env.RELEASE_VERSION }}" `
                   --packDir "./publish/win-x64" `
                   --mainExe "CL(CLegendary Launcher).exe" `
                   --icon "CL.Avalonia/Icon/IconCL(Halloween).ico" `
                   --packTitle "CLegendary Launcher" `
                   --packAuthors "WER-CORE" `
                   --outputDir "./release_output"

      - name: Sign installer and portable binaries via SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        continue-on-error: true
        shell: pwsh
        run: |
          if (Test-Path "./release_output/CLegendaryLauncher-win-Setup.exe") {
            Submit-SigningRequest `
              -InputArtifactPath "./release_output/CLegendaryLauncher-win-Setup.exe" `
              -OutputArtifactPath "./signed-launcher/CLegendaryLauncher-win-Setup.exe" `
              -ApiToken "${{ env.SIGNPATH_API_TOKEN }}" `
              -OrganizationId "${{ env.SIGNPATH_ORGANIZATION_ID }}" `
              -ProjectSlug "${{ env.SIGNPATH_PROJECT_SLUG }}" `
              -SigningPolicySlug "${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}" `
              -WaitForCompletion
            if (Test-Path "./signed-launcher/CLegendaryLauncher-win-Setup.exe") {
              Copy-Item -Path "./signed-launcher/CLegendaryLauncher-win-Setup.exe" -Destination "./release_output/CLegendaryLauncher-win-Setup.exe" -Force
            }
          }

          if (Test-Path "./release_output/CLegendaryLauncher-win-Portable.zip") {
            $portableTemp = "./portable-temp"
            if (Test-Path $portableTemp) { Remove-Item -Path $portableTemp -Recurse -Force }
            Expand-Archive -Path "./release_output/CLegendaryLauncher-win-Portable.zip" -DestinationPath $portableTemp -Force

            if (-not (Test-Path "$portableTemp/CL(CLegendary Launcher).exe")) {
              if (Test-Path "$portableTemp/current/CL(CLegendary Launcher).exe") {
                Copy-Item -Path "$portableTemp/current/CL(CLegendary Launcher).exe" -Destination "$portableTemp/CL(CLegendary Launcher).exe" -Force
              } elseif (Test-Path "./publish/win-x64/CL(CLegendary Launcher).exe") {
                Copy-Item -Path "./publish/win-x64/CL(CLegendary Launcher).exe" -Destination "$portableTemp/CL(CLegendary Launcher).exe" -Force
              }
            }

            if (Test-Path "$portableTemp/CLegendaryLauncher.exe") {
              Submit-SigningRequest `
                -InputArtifactPath "$portableTemp/CLegendaryLauncher.exe" `
                -OutputArtifactPath "./signed-launcher/CLegendaryLauncher.exe" `
                -ApiToken "${{ env.SIGNPATH_API_TOKEN }}" `
                -OrganizationId "${{ env.SIGNPATH_ORGANIZATION_ID }}" `
                -ProjectSlug "${{ env.SIGNPATH_PROJECT_SLUG }}" `
                -SigningPolicySlug "${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}" `
                -WaitForCompletion
              if (Test-Path "./signed-launcher/CLegendaryLauncher.exe") {
                Copy-Item -Path "./signed-launcher/CLegendaryLauncher.exe" -Destination "$portableTemp/CLegendaryLauncher.exe" -Force
              }
            }

            Remove-Item -Path "./release_output/CLegendaryLauncher-win-Portable.zip" -Force
            Compress-Archive -Path "$portableTemp/*" -DestinationPath "./release_output/CLegendaryLauncher-win-Portable.zip" -Force
            Remove-Item -Path $portableTemp -Recurse -Force
          }

      - name: Organize Windows release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "./windows_artifacts" -Force | Out-Null
          Get-ChildItem -Path "./release_output" -Filter "*.nupkg" | Move-Item -Destination "./windows_artifacts/"
          Get-ChildItem -Path "./release_output" -Filter "*.json" | Move-Item -Destination "./windows_artifacts/"
          if (Test-Path "./release_output/RELEASES") { Move-Item -Path "./release_output/RELEASES" -Destination "./windows_artifacts/" }
          if (Test-Path "./release_output/CLegendaryLauncher-win-Setup.exe") {
            Copy-Item -Path "./release_output/CLegendaryLauncher-win-Setup.exe" -Destination "./windows_artifacts/CLegendaryLauncher-Windows-Setup.exe"
          }
          if (Test-Path "./release_output/CLegendaryLauncher-win-Portable.zip") {
            Copy-Item -Path "./release_output/CLegendaryLauncher-win-Portable.zip" -Destination "./windows_artifacts/CLegendaryLauncher-Windows-Portable.zip"
          }

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-assets
          path: ./windows_artifacts/*

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      NUMERIC_VERSION: ${{ needs.prepare.outputs.numeric_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          dotnet-quality: 'preview'

      - name: Generate compiled secrets
        if: env.APP_SECRETS_JSON != ''
        shell: pwsh
        env:
          APP_SECRETS_JSON: ${{ secrets.APP_SECRETS_JSON }}
        run: |
          $json = $env:APP_SECRETS_JSON | ConvertFrom-Json
          $secrets = $json.Secrets
          if (-not $secrets) { $secrets = $json }
          $code = @"
          namespace CL.Core.Services;

          public static partial class SecretsProvider
          {
              static partial void ApplyCompiledDefaults(SecretConfiguration config)
              {
                  config.LauncherSecret = "$($secrets.LauncherSecret)";
                  config.CurseForgeKeyUrl = "$($secrets.CurseForgeKeyUrl)";
                  config.CurseForgeDirectApiKey = "$($secrets.CurseForgeDirectApiKey)";
                  config.GeminiApiUrl = "$($secrets.GeminiApiUrl)";
                  config.GeminiModelUrl = "$($secrets.GeminiModelUrl)";
                  config.GeminiDirectApiKey = "$($secrets.GeminiDirectApiKey)";
                  config.SentryDsn = "$($secrets.SentryDsn)";
                  config.AzureClientId = "$($secrets.AzureClientId)";
                  config.DiscordClientId = "$($secrets.DiscordClientId)";
              }
          }
          "@
          $code | Out-File -FilePath "CL.Core/Services/SecretsProvider.Compiled.cs" -Encoding utf8

      - name: Publish Linux x64
        run: |
          dotnet publish CL.Avalonia/CL.Avalonia.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false -p:Version=${{ env.RELEASE_VERSION }} -p:AssemblyVersion=${{ env.NUMERIC_VERSION }}.0 -p:FileVersion=${{ env.NUMERIC_VERSION }}.0 -p:InformationalVersion=${{ env.RELEASE_VERSION }} -o ./publish/linux-x64
          cp ./publish/linux-x64/CL.Avalonia "./publish/linux-x64/CL(CLegendary Launcher)" || true
          chmod +x ./publish/linux-x64/CL* || true

      - name: Publish Linux arm64
        run: |
          dotnet publish CL.Avalonia/CL.Avalonia.csproj -c Release -r linux-arm64 --self-contained true -p:PublishSingleFile=false -p:Version=${{ env.RELEASE_VERSION }} -p:AssemblyVersion=${{ env.NUMERIC_VERSION }}.0 -p:FileVersion=${{ env.NUMERIC_VERSION }}.0 -p:InformationalVersion=${{ env.RELEASE_VERSION }} -o ./publish/linux-arm64
          cp ./publish/linux-arm64/CL.Avalonia "./publish/linux-arm64/CL(CLegendary Launcher)" || true
          chmod +x ./publish/linux-arm64/CL* || true

      - name: Install libfuse2
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Package with Velopack Linux x64
        run: |
          mkdir -p ./linux_artifacts_x64
          vpk pack --packId "CLegendaryLauncher" \
                   --packVersion "${{ env.RELEASE_VERSION }}" \
                   --packDir "./publish/linux-x64" \
                   --mainExe "CL.Avalonia" \
                   --icon "CL.Avalonia/Icon/IconCL(Halloween).png" \
                   --packTitle "CLegendary Launcher" \
                   --packAuthors "WER-CORE" \
                   --channel "linux" \
                   --runtime "linux-x64" \
                   --outputDir "./linux_artifacts_x64"

      - name: Package with Velopack Linux arm64
        run: |
          mkdir -p ./linux_artifacts_arm64
          vpk pack --packId "CLegendaryLauncher" \
                   --packVersion "${{ env.RELEASE_VERSION }}" \
                   --packDir "./publish/linux-arm64" \
                   --mainExe "CL.Avalonia" \
                   --icon "CL.Avalonia/Icon/IconCL(Halloween).png" \
                   --packTitle "CLegendary Launcher" \
                   --packAuthors "WER-CORE" \
                   --channel "linux-arm64" \
                   --runtime "linux-arm64" \
                   --outputDir "./linux_artifacts_arm64"

      - name: Organize Linux release artifacts
        run: |
          mkdir -p ./linux_artifacts
          cp -r ./linux_artifacts_x64/* ./linux_artifacts/
          if [ -f ./linux_artifacts/CLegendaryLauncher.AppImage ]; then
            mv ./linux_artifacts/CLegendaryLauncher.AppImage ./linux_artifacts/CLegendaryLauncher-x64.AppImage
          fi
          cp ./linux_artifacts_arm64/*.nupkg ./linux_artifacts/ 2>/dev/null || true
          cp ./linux_artifacts_arm64/*.json ./linux_artifacts/ 2>/dev/null || true
          for f in ./linux_artifacts_arm64/*.AppImage; do
            if [ -f "$f" ]; then
              cp "$f" ./linux_artifacts/CLegendaryLauncher-arm64.AppImage || true
            fi
          done
          tar -czf ./linux_artifacts/CLegendaryLauncher-linux-x64.tar.gz -C ./publish/linux-x64 .
          tar -czf ./linux_artifacts/CLegendaryLauncher-linux-arm64.tar.gz -C ./publish/linux-arm64 .
          ls -la ./linux_artifacts

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets
          path: ./linux_artifacts/*

  build-macos:
    needs: prepare
    runs-on: macos-latest
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      NUMERIC_VERSION: ${{ needs.prepare.outputs.numeric_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          dotnet-quality: 'preview'

      - name: Generate compiled secrets
        if: env.APP_SECRETS_JSON != ''
        shell: pwsh
        env:
          APP_SECRETS_JSON: ${{ secrets.APP_SECRETS_JSON }}
        run: |
          $json = $env:APP_SECRETS_JSON | ConvertFrom-Json
          $secrets = $json.Secrets
          if (-not $secrets) { $secrets = $json }
          $code = @"
          namespace CL.Core.Services;

          public static partial class SecretsProvider
          {
              static partial void ApplyCompiledDefaults(SecretConfiguration config)
              {
                  config.LauncherSecret = "$($secrets.LauncherSecret)";
                  config.CurseForgeKeyUrl = "$($secrets.CurseForgeKeyUrl)";
                  config.CurseForgeDirectApiKey = "$($secrets.CurseForgeDirectApiKey)";
                  config.GeminiApiUrl = "$($secrets.GeminiApiUrl)";
                  config.GeminiModelUrl = "$($secrets.GeminiModelUrl)";
                  config.GeminiDirectApiKey = "$($secrets.GeminiDirectApiKey)";
                  config.SentryDsn = "$($secrets.SentryDsn)";
                  config.AzureClientId = "$($secrets.AzureClientId)";
                  config.DiscordClientId = "$($secrets.DiscordClientId)";
              }
          }
          "@
          $code | Out-File -FilePath "CL.Core/Services/SecretsProvider.Compiled.cs" -Encoding utf8

      - name: Publish macOS arm64 (Apple Silicon)
        run: |
          dotnet publish CL.Avalonia/CL.Avalonia.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=false -p:Version=${{ env.RELEASE_VERSION }} -p:AssemblyVersion=${{ env.NUMERIC_VERSION }}.0 -p:FileVersion=${{ env.NUMERIC_VERSION }}.0 -p:InformationalVersion=${{ env.RELEASE_VERSION }} -o ./publish/osx-arm64
          chmod +x ./publish/osx-arm64/CL* || true

      - name: Publish macOS x64 (Intel)
        run: |
          dotnet publish CL.Avalonia/CL.Avalonia.csproj -c Release -r osx-x64 --self-contained true -p:PublishSingleFile=false -p:Version=${{ env.RELEASE_VERSION }} -p:AssemblyVersion=${{ env.NUMERIC_VERSION }}.0 -p:FileVersion=${{ env.NUMERIC_VERSION }}.0 -p:InformationalVersion=${{ env.RELEASE_VERSION }} -o ./publish/osx-x64
          chmod +x ./publish/osx-x64/CL* || true

      - name: Generate macOS ICNS icon
        run: |
          mkdir -p icon.iconset
          sips -z 16 16     "CL.Avalonia/Icon/IconCL(Halloween).png" --out icon.iconset/icon_16x16.png
          sips -z 32 32     "CL.Avalonia/Icon/IconCL(Halloween).png" --out icon.iconset/icon_16x16@2x.png
          sips -z 32 32     "CL.Avalonia/Icon/IconCL(Halloween).png" --out icon.iconset/icon_32x32.png
          sips -z 64 64     "CL.Avalonia/Icon/IconCL(Halloween).png" --out icon.iconset/icon_32x32@2x.png
          sips -z 128 128   "CL.Avalonia/Icon/IconCL(Halloween).png" --out icon.iconset/icon_128x128.png
          sips -z 256 256   "CL.Avalonia/Icon/IconCL(Halloween).png" --out icon.iconset/icon_128x128@2x.png
          sips -z 256 256   "CL.Avalonia/Icon/IconCL(Halloween).png" --out icon.iconset/icon_256x256.png
          sips -z 512 512   "CL.Avalonia/Icon/IconCL(Halloween).png" --out icon.iconset/icon_256x256@2x.png
          sips -z 512 512   "CL.Avalonia/Icon/IconCL(Halloween).png" --out icon.iconset/icon_512x512.png
          sips -z 1024 1024 "CL.Avalonia/Icon/IconCL(Halloween).png" --out icon.iconset/icon_512x512@2x.png
          iconutil -c icns icon.iconset -o icon.icns

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Package with Velopack macOS (Apple Silicon arm64)
        run: |
          vpk pack --packId "CLegendaryLauncher" \
                   --packVersion "${{ env.RELEASE_VERSION }}" \
                   --packDir "./publish/osx-arm64" \
                   --mainExe "CL.Avalonia" \
                   --icon "icon.icns" \
                   --packTitle "CLegendary Launcher" \
                   --packAuthors "WER-CORE" \
                   --channel "osx-arm64" \
                   --outputDir "./macos_artifacts"

      - name: Package with Velopack macOS (Intel x64)
        run: |
          vpk pack --packId "CLegendaryLauncher" \
                   --packVersion "${{ env.RELEASE_VERSION }}" \
                   --packDir "./publish/osx-x64" \
                   --mainExe "CL.Avalonia" \
                   --icon "icon.icns" \
                   --packTitle "CLegendary Launcher" \
                   --packAuthors "WER-CORE" \
                   --channel "osx-x64" \
                   --outputDir "./macos_artifacts"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-assets
          path: ./macos_artifacts/*

  publish-release:
    needs: [prepare, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./downloaded_artifacts

      - name: Flatten release assets
        run: |
          mkdir -p ./release_final
          find ./downloaded_artifacts -type f -exec mv {} ./release_final/ \;
          ls -la ./release_final

      - name: Generate Release Body
        env:
          CHANGELOG_TEXT: ${{ needs.prepare.outputs.changelog }}
        run: |
          VER="${{ needs.prepare.outputs.version }}"
          > body.md
          if [ -n "$CHANGELOG_TEXT" ]; then
            echo "### 📝 Що нового / Changelog:" >> body.md
            echo "$CHANGELOG_TEXT" >> body.md
            echo "" >> body.md
            echo "---" >> body.md
          fi
          cat << EOF >> body.md
          ### 📦 CLegendary Launcher v${VER}

          #### 🚀 Downloads:
          | Platform | File | Description |
          |:---|:---|:---|
          | 🪟 **Windows (Installer)** | \`CLegendaryLauncher-Windows-Setup.exe\` | Recommended Installer with auto-updates |
          | 🪟 **Windows (Portable)** | \`CLegendaryLauncher-Windows-Portable.zip\` | Portable standalone package with auto-updates |
          | 🐧 **Linux (x64 AppImage)** | \`CLegendaryLauncher-x64.AppImage\` | Universal AppImage for Intel/AMD 64-bit with auto-updates |
          | 🐧 **Linux (ARM64 AppImage)** | \`CLegendaryLauncher-arm64.AppImage\` | AppImage for Raspberry Pi 4/5, Orange Pi, ARM64 |
          | 🐧 **Linux (x64 Tarball)** | \`CLegendaryLauncher-linux-x64.tar.gz\` | Binaries archive (Flathub & generic Linux) |
          | 🐧 **Linux (ARM64 Tarball)** | \`CLegendaryLauncher-linux-arm64.tar.gz\` | Binaries archive for ARM64 |
          | 🍎 **macOS Apple Silicon (Installer)** | \`CLegendaryLauncher-osx-arm64-Setup.pkg\` | Package Installer for Apple Silicon (M1/M2/M3/M4) |
          | 🍎 **macOS Apple Silicon (Portable)** | \`CLegendaryLauncher-osx-arm64-Portable.zip\` | Portable package for Apple Silicon (M1/M2/M3/M4) |
          | 🍏 **macOS Intel (Installer)** | \`CLegendaryLauncher-osx-x64-Setup.pkg\` | Package Installer for Intel Macs |
          | 🍏 **macOS Intel (Portable)** | \`CLegendaryLauncher-osx-x64-Portable.zip\` | Portable package for Intel Macs |

          <details>
          <summary>🔍 Velopack & Automated Update Feeds (Internal)</summary>

          - \`*.nupkg\` (Windows, Linux, macOS full & delta feeds)
          - \`releases.*.json\`
          - \`assets.*.json\`
          - \`RELEASES*\`
          </details>
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ needs.prepare.outputs.target_repo }}
          token: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
