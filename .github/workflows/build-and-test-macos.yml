name: Build and Test

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          dotnet-quality: 'preview'

      - name: Restore dependencies
        run: dotnet restore CL.Crossplatform.sln

      - name: Build
        run: dotnet build CL.Crossplatform.sln -c Release --no-restore

      - name: Test
        run: dotnet test CL.Crossplatform.sln -c Release --no-build --verbosity normal

      - name: Publish macOS arm64 (Apple Silicon)
        run: dotnet publish CL.Avalonia/CL.Avalonia.csproj -c Release -r osx-arm64 --self-contained true -p:PublishSingleFile=false -o ./publish/osx-arm64

      - name: Create ZIP archive
        run: |
          ditto -c -k --sequesterRsrc ./publish/osx-arm64 ./CLegendaryLauncher-osx-arm64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLegendaryLauncher-osx-arm64
          path: ./CLegendaryLauncher-osx-arm64.zip
          if-no-files-found: error
          retention-days: 30
